<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2f6b"/>
      <stop offset="55%" stop-color="#2a2350"/>
      <stop offset="100%" stop-color="#1b1738"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe4d2"/>
      <stop offset="100%" stop-color="#f7c9b3"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="55%" stop-color="#2aa8e0"/>
      <stop offset="100%" stop-color="#14507a"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f3b63"/>
      <stop offset="100%" stop-color="#1d2440"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a5b8f"/>
      <stop offset="100%" stop-color="#2a3358"/>
    </linearGradient>
  </defs>

  

  <!-- twin tails -->
  <path d="M78 150 C48 176 40 226 54 268 C74 250 90 214 92 178 Z" fill="url(#hair)"/>
  <path d="M242 150 C272 176 280 226 266 268 C246 250 230 214 228 178 Z" fill="url(#hair)"/>

  <!-- shoulders / hoodie -->
  <path d="M96 280 C96 236 120 214 160 214 C200 214 224 236 224 280 Z" fill="url(#hoodie)"/>
  <path d="M160 220 L160 244" stroke="#151a2e" stroke-width="3" opacity="0.45"/>

  <!-- neck -->
  <rect x="146" y="188" width="28" height="34" rx="12" fill="url(#skin)"/>

  <!-- back hair -->
  <path d="M160 42 C104 42 78 84 78 140 C78 190 100 214 160 214 C220 214 242 190 242 140 C242 84 216 42 160 42 Z" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="160" cy="140" rx="62" ry="66" fill="url(#skin)"/>

  <!-- ears -->
  <ellipse cx="98" cy="146" rx="10" ry="15" fill="#f7c9b3"/>
  <ellipse cx="222" cy="146" rx="10" ry="15" fill="#f7c9b3"/>

  <!-- bangs -->
  <path d="M96 130 C100 82 126 62 160 62 C194 62 220 82 224 130
           C212 112 196 104 180 108 C184 96 178 86 168 82
           C160 96 148 104 136 106 C122 108 108 116 96 130 Z" fill="url(#hair)"/>

  <!-- eyebrows -->
  <path d="M124 128 q14 -8 28 -2" stroke="#3a2c5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M168 126 q14 -6 28 2" stroke="#3a2c5c" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <g>
    <ellipse cx="134" cy="152" rx="17" ry="21" fill="#fff"/>
    <ellipse cx="134" cy="153" rx="13" ry="17" fill="url(#eye)"/>
    <ellipse cx="134" cy="156" rx="6" ry="8" fill="#0b2340"/>
    <circle cx="129" cy="145" r="5" fill="#fff"/>
    <circle cx="139" cy="162" r="2.6" fill="#fff" opacity="0.85"/>
  </g>
  <g>
    <ellipse cx="186" cy="152" rx="17" ry="21" fill="#fff"/>
    <ellipse cx="186" cy="153" rx="13" ry="17" fill="url(#eye)"/>
    <ellipse cx="186" cy="156" rx="6" ry="8" fill="#0b2340"/>
    <circle cx="181" cy="145" r="5" fill="#fff"/>
    <circle cx="191" cy="162" r="2.6" fill="#fff" opacity="0.85"/>
  </g>

  <!-- lashes -->
  <path d="M116 138 q18 -12 36 -2" stroke="#241c3c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M168 136 q18 -10 36 2" stroke="#241c3c" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="112" cy="176" rx="14" ry="8" fill="#ff8fa8" opacity="0.45"/>
  <ellipse cx="208" cy="176" rx="14" ry="8" fill="#ff8fa8" opacity="0.45"/>

  <!-- mouth -->
  <path d="M154 182 q6 7 12 0" stroke="#a4525f" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- cat ears -->
  <path d="M112 62 L104 22 L146 48 Z" fill="#39446e"/>
  <path d="M208 62 L216 22 L174 48 Z" fill="#39446e"/>
  <path d="M116 58 L111 34 L138 50 Z" fill="#ff9db4" opacity="0.75"/>
  <path d="M204 58 L209 34 L182 50 Z" fill="#ff9db4" opacity="0.75"/>

  <!-- headphones -->
  <path d="M84 132 C84 74 118 46 160 46 C202 46 236 74 236 132" stroke="#39446e" stroke-width="12" fill="none" stroke-linecap="round"/>
  <rect x="62" y="126" width="30" height="46" rx="14" fill="url(#cup)"/>
  <rect x="228" y="126" width="30" height="46" rx="14" fill="url(#cup)"/>
  <rect x="68" y="136" width="18" height="26" rx="9" fill="#7fe3ff" opacity="0.7"/>
  <rect x="234" y="136" width="18" height="26" rx="9" fill="#7fe3ff" opacity="0.7"/>
  <circle cx="236" cy="150" r="3" fill="#d6f6ff"/>
</svg>
