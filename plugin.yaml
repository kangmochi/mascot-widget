name: mascot-guide
label: Mascot Widget
version: 1.0.0
requires_hermes: ">=0.22.0"
author: kangmochi
homepage: https://github.com/kangmochi/mascot-widget
description: >
  A mascot that floats in the corner of Hermes Desktop: it says what the agent is
  doing, shows tokens, context and session cost, and opens a status panel with
  copy, compress and stop. Colours, aura glow, size and the position of the
  bubble, cards and panel are all adjustable, with Simple and Advanced settings
  tabs and three layout presets. Desktop-only (desktop/plugin.js); no agent
  tools, hooks, middleware or env vars.
tags: [desktop, mascot, status, usage, appearance]
